id = "obsidian_scourge"
name = "The Obsidian Scourge"
type = "main"

[[stages]]
id = "intro"
label = "Investigate the Corruption"
condition = ""
journal_entry = "The world is flickering. Speak with Elder Vaelen in the Valley of Ash about the 'System Glitch' and find the Obsidian Eye."
next = [{ condition = "flag:has_obsidian_eye", stage = "ignis_hunt" }]

[[stages]]
id = "ignis_hunt"
label = "The Heart of the Forge"
condition = "flag:has_obsidian_eye"
journal_entry = "The Obsidian Eye has revealed the source of the heat-bloom: Ignis the Cinder-Drake has claimed the Emberpeak Summit. Defeat him to retrieve the Obsidian Heart."
next = [{ condition = "flag:defeated_ignis && flag:has_obsidian_heart", stage = "woods_exploration" }]

[[stages]]
id = "woods_exploration"
label = "Silence in the Woods"
condition = "flag:has_obsidian_heart"
journal_entry = "With the Heart secured, you must now find the Sylvan Glitch-Key hidden within the Whispering Woods to bypass the Null-Shield."
next = [{ condition = "flag:has_sylvan_glitch_key", stage = "malphas_hunt" }]

[[stages]]
id = "malphas_hunt"
label = "The Void-Sanctum"
condition = "flag:has_sylvan_glitch_key"
journal_entry = "The Glitch-Key has opened the way. Locate Malphas the Void-Lich in his sanctum and claim the Null-Scepter before the deletion is complete."
next = [{ condition = "flag:defeated_malphas && flag:has_null_scepter", stage = "final_seal" }]

[[stages]]
id = "final_seal"
label = "System Restore"
condition = "flag:has_null_scepter"
journal_entry = "You possess the three keystones: Eye, Heart, and Scepter. Return to the Peak Crater to initiate the System Restore and end the Scourge."
next = [{ condition = "flag:scourge_ended", stage = "DONE" }]
