npc_id = "captain_kael"

[[nodes]]
id = "root"
text = "The goblins probe our gate nightly. Will you stand with us?"

[[nodes.choices]]
text = "I will help your guard."
condition = ""
next = "accept"
effect = [{ set_flag = "accept_demo_quest" }]

[[nodes.choices]]
text = "Call in extra guard support for the next fight."
condition = "counter:faction_town_guard_rep >= 2"
next = "support"
effect = [{ set_flag = "request_guard_support" }]

[[nodes.choices]]
text = "Not right now."
condition = ""
next = "END"

[[nodes]]
id = "accept"
text = "Then clear Ember Square and report back."

[[nodes.choices]]
text = "Understood."
condition = ""
next = "END"

[[nodes]]
id = "support"
text = "You have earned our trust. A guard squad will reinforce your next patrol."

[[nodes.choices]]
text = "I appreciate it."
condition = ""
next = "END"
