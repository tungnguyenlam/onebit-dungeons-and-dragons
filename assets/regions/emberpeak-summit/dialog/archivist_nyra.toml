next = "END"

[[nodes]]
id = "artifact_hint"
text = "The artifact is likely hidden in the deepest chamber of the Ironhold Mines. Look for a door with glowing red runes - that's where the seal is. But be warned, the drow will guard it fiercely."

[[nodes.choices]]
text = "I'll find it."
condition = ""
next = "END"

[[nodes.choices]]
text = "Show me the route markings."
condition = ""
next = "route"

[[nodes]]
