text = "The ancient texts speak of a powerful artifact that could control the volcano. The dwarves sealed it away to prevent catastrophe. But if the drow have found it..."

[[nodes.choices]]
text = "That sounds dangerous. I must find this artifact."
condition = "flag:read_ember_rune"
next = "artifact_hint"

[[nodes.choices]]
text = "Show me the route markings."
