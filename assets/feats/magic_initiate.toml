id = "magic_initiate"
name = "Magic Initiate"
description = "Choose a class: bard, cleric, druid, sorcerer, warlock, or wizard. You learn two cantrips of your choice from that class's spell list. In addition, choose one 1st-level spell from that class's spell list. You can cast this spell once without expending a spell slot, and you must finish a long rest before you can cast it in this way again."
