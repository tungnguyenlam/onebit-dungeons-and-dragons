[package]
name    = "onebit-dungeons-and-dragons"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dnd"
path = "src/main.rs"

[dependencies]
ratatui     = "0.29"
crossterm   = { version = "0.28", features = ["event-stream"] }
serde       = { version = "1", features = ["derive"] }
toml        = "0.8"
rand        = "0.9"
anyhow      = "1"
tokio       = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
pretty_assertions = "1"
