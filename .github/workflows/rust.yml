name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Install expect for TUI smoke/soak
      run: sudo apt-get update && sudo apt-get install -y expect
    - name: Asset validation
      run: cargo run -- --validate-assets
    - name: PR soak profile (short)
      if: github.event_name == 'pull_request'
      run: ./scripts/agent_tui_smoke.sh --soak --profile standard --minutes 1 --token-efficient --no-build
