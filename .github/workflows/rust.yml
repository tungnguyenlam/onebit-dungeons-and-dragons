name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # T1 — fast checks (format, lint, build, asset validate, unit tests)
  # Runs on every push & PR.
  # ---------------------------------------------------------------------------
  fast:
    name: "T1 · Fast gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Asset validation
        run: cargo run -- --validate-assets
      - name: Save/load roundtrip suite (M20)
        run: cargo test save -- --nocapture
      - name: Region traversal suite (M21)
        run: cargo test validate -- --nocapture
      - name: Quest runtime suite (M22)
        run: cargo test quest -- --nocapture
      - name: Combat AI suite (M23)
        run: cargo test "game::combat::ai" -- --nocapture

  # ---------------------------------------------------------------------------
  # T2 — slow checks (full test matrix + TUI smoke).
  # Runs on every push & PR, after T1.
  # ---------------------------------------------------------------------------
  slow:
    name: "T2 · Full test suite"
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build
      - name: Run all tests
        run: cargo test --verbose
      - name: Install expect (TUI smoke)
        run: sudo apt-get update && sudo apt-get install -y expect
      - name: TUI smoke
        run: ./scripts/agent_tui_smoke.sh --no-build

  # ---------------------------------------------------------------------------
  # T3 — RC gate (soak profile, tag-triggered only).
  # Runs only when a vX.Y.Z tag is pushed.
  # ---------------------------------------------------------------------------
  release:
    name: "T3 · Release candidate gate"
    needs: slow
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release binary
        run: cargo build --release --verbose
      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect
      - name: Full RC check (T1 + T2 + soak)
        run: ./scripts/rc_check.sh --all
